name: Sync Conference Data

# Keeps public/data/conferences.yaml in step with the community-maintained
# CCFDDL database (https://github.com/ccfddl/ccf-deadlines), which covers 66 of
# the 73 conferences we track. No LLM and no API key involved.
#
# sync_ccfddl.py only rewrites an entry when CCFDDL confirms it: a matching date
# gains `verified: true`, and an `estimated` entry whose date CCFDDL contradicts
# is corrected and promoted to verified. Anything CCFDDL does not cover keeps
# its `estimated` flag, so the UI continues to badge it as a guess.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync against CCFDDL
        run: python scripts/sync_ccfddl.py --apply

      - name: Commit any changes
        id: commit
        run: |
          if git diff --quiet public/data/conferences.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from CCFDDL; nothing to deploy."
            exit 0
          fi

          echo "Changes found:"
          git --no-pager diff --stat public/data/conferences.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/conferences.yaml
          git commit -m "data: sync conference dates from CCFDDL"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Only runs when the sync actually committed something. Reuses deploy.yml so
  # the build and publish steps live in exactly one place.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
